<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Expert Recouvrement - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-bg: #0f172a;
            --main-bg: #f1f5f9;
            --primary: #3b82f6;
            --danger: #ef4444;
            --success: #10b981;
            --text-main: #1e293b;
            --warning: #f59e0b;
        }

        body {
            margin: 0;
            display: flex;
            font-family: 'Inter', sans-serif;
            background: var(--main-bg);
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            background: var(--sidebar-bg);
            color: white;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 30px 20px;
            font-weight: 800;
            color: var(--primary);
            text-align: center;
            border-bottom: 1px solid #1e293b;
            font-size: 1.2rem;
        }

        .menu-nav {
            flex: 1;
            padding-top: 10px;
            overflow-y: auto;
        }

        .menu-item {
            padding: 12px 25px;
            cursor: pointer;
            color: #94a3b8;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .menu-item:hover,
        .menu-item.active {
            background: #1e293b;
            color: white;
        }

        .menu-item.active {
            border-right: 4px solid var(--primary);
            background: #1e293b;
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            min-height: 500px;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 15px;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        th {
            text-align: left;
            padding: 12px;
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 700;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #f1f5f9;
            color: var(--text-main);
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            border: none;
            transition: 0.2s;
            font-size: 0.85rem;
        }

        .btn-add {
            background: var(--primary);
            color: white;
        }

        .btn-import {
            background: var(--success);
            color: white;
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            color: #64748b;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            font-size: 0.95rem;
            padding: 0;
        }

        .btn-icon:hover {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: white;
            margin: 2% auto;
            padding: 30px;
            border-radius: 12px;
            width: 550px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-height: 85vh;
            overflow-y: auto;
        }

        #step-1 h2 {
            margin-top: 0;
            font-size: 1.1rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .action-choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .action-choice-btn {
            padding: 18px 12px;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            background: #f8fafc;
            cursor: pointer;
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
            transition: all 0.18s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .action-choice-btn:hover {
            border-color: var(--primary);
            background: #eff6ff;
            color: var(--primary);
        }

        .action-choice-btn.danger:hover {
            border-color: var(--danger);
            background: #fef2f2;
            color: var(--danger);
        }

        .action-choice-btn.warning:hover {
            border-color: var(--warning);
            background: #fffbeb;
            color: var(--warning);
        }

        .action-choice-btn.success:hover {
            border-color: var(--success);
            background: #ecfdf5;
            color: var(--success);
        }

        .action-choice-btn .icon {
            font-size: 1.6rem;
        }

        #step-2 {
            display: none;
        }

        .step2-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
        }

        .step2-header button {
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            font-size: 1.1rem;
            padding: 4px 8px;
            border-radius: 4px;
            transition: 0.15s;
        }

        .step2-header button:hover {
            background: #f1f5f9;
            color: #475569;
        }

        .step2-header h2 {
            margin: 0;
            font-size: 1.1rem;
        }

        .step2-header .badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 20px;
            background: #eff6ff;
            color: var(--primary);
            border: 1px solid #bfdbfe;
        }

        .step2-header .badge.danger {
            background: #fef2f2;
            color: var(--danger);
            border-color: #fecaca;
        }

        .step2-header .badge.warning {
            background: #fffbeb;
            color: var(--warning);
            border-color: #fde68a;
        }

        .step2-header .badge.success {
            background: #ecfdf5;
            color: var(--success);
            border-color: #a7f3d0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full {
            grid-column: span 2;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .import-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #e2e8f0;
        }

        #delete-warning {
            color: var(--danger);
            font-size: 0.8rem;
            margin-bottom: 15px;
            font-weight: bold;
            background: #fee2e2;
            padding: 10px;
            border-radius: 6px;
        }

        .hidden {
            display: none;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-header">RECOUVREMENT AI</div>
        <div class="menu-nav">
            <div class="menu-item active" onclick="loadData('clients', this)">👥 Clients</div>
            <div class="menu-item" onclick="loadData('factures', this)">📄 Factures</div>
            <div class="menu-item" onclick="loadData('utilisateurs', this)">👤 Utilisateurs</div>
            <div class="menu-item" onclick="loadData('structures', this)">🏢 Structures</div>
            <div class="menu-item" onclick="loadRelance(this)">🔄 Relance</div>
        </div>
        <div style="padding: 20px;">
            <button onclick="handleLogout()"
                style="width:100%; padding:10px; background:#ef4444; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600; font-size:0.85rem;">🚪
                Déconnexion</button>
        </div>
    </div>

    <div class="main-content">
        <div class="card" id="display-area">
            <div class="loading">Chargement...</div>
        </div>
    </div>

    <div id="actionModal" class="modal">
        <div class="modal-content">

            <div id="step-1">
                <h2>Que voulez-vous faire ?</h2>
                <input type="hidden" id="field-table">
                <div id="action-choices-container" class="action-choices"></div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal()"
                        style="background:#f1f5f9;">Annuler</button>
                </div>
            </div>

            <div id="step-2">
                <div class="step2-header">
                    <button onclick="backToStep1()" title="Retour">←</button>
                    <h2 id="modalTitle">Configuration</h2>
                    <span class="badge" id="action-badge"></span>
                </div>

                <input type="hidden" id="field-mode">

                <div id="delete-warning" class="hidden">⚠️ Attention : Action irréversible.</div>

                <div id="form-clients-container" class="form-container hidden">
                    <div class="form-grid">
                        <div class="form-group full"><label>Nom Client</label><input type="text" id="c-nom"></div>
                        <div class="form-group"><label>Email (ID Unique)</label><input type="email" id="c-email"></div>
                        <div class="form-group"><label>ICE</label><input type="text" id="c-ice"></div>
                        <div class="form-group"><label>Téléphone</label><input type="text" id="c-telephone"></div>
                        <div class="form-group"><label>Adresse</label><input type="text" id="c-adresse"></div>
                    </div>
                </div>

                <div id="form-factures-container" class="form-container hidden">
                    <div class="form-grid">
                        <div class="form-group"><label>N° Facture</label><input type="text" id="f-n_facture"></div>
                        <div class="form-group"><label>Type de Facture</label>
                            <select id="f-type" onchange="toggleAvoirField()">
                                <option value="Standard">Standard</option>
                                <option value="Avoir">Avoir</option>
                                <option value="Pro-forma">Pro-forma</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Client</label>
                            <input type="text" id="f-client" list="list-clients" placeholder="Taper ou choisir...">
                            <datalist id="list-clients"></datalist>
                        </div>
                        <div class="form-group">
                            <label>Structure</label>
                            <input type="text" id="f-structure" list="list-structures"
                                placeholder="Taper ou choisir...">
                            <datalist id="list-structures"></datalist>
                        </div>
                        <div class="form-group"><label>Montant HT</label><input type="number" id="f-montant"
                                step="0.01"></div>
                        <div class="form-group"><label>Soumis à la TVA</label>
                            <select id="f-soumis-tva" onchange="toggleTVAField()">
                                <option value="true">Oui</option>
                                <option value="false">Non</option>
                            </select>
                        </div>
                        <div class="form-group" id="container-f-tva"><label>TVA (%)</label><input type="number"
                                id="f-tva" value="20"></div>
                        <div class="form-group"><label>Date d'émission</label><input type="date" id="f-date-emission">
                        </div>
                        <div class="form-group"><label>Délai de paiement</label>
                            <select id="f-delai">
                                <option value="Immédiat">Immédiat</option>
                                <option value="30 jours">30 jours</option>
                                <option value="60 jours">60 jours</option>
                            </select>
                        </div>
                        <div class="form-group full"><label>Affaire</label><textarea id="f-affaire" rows="2"></textarea>
                        </div>
                        <div class="form-group"><label>N° BL</label><input type="text" id="f-n-bl"></div>
                        <div class="form-group"><label>N° Commande</label><input type="text" id="f-n-commande"></div>
                        <div class="form-group"><label>Date Commande</label><input type="date" id="f-date-commande">
                        </div>
                        <div class="form-group" id="container-f-avoir" style="display:none;"><label>ID Facture
                                Originale</label><input type="text" id="f-id-facture-originale"></div>
                        <div class="form-group">
                            <label>Mode de paiement</label>
                            <select id="f-mode-paiement">
                                <option value="">Choisir...</option>
                                <option value="Virement bancaire">Virement bancaire</option>
                                <option value="Chèque">Chèque</option>
                                <option value="Espèces">Espèces</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Date de remise</label><input type="date" id="f-date-remise">
                        </div>
                        <div class="form-group"><label>Date de paiement</label><input type="date" id="f-date-paiement">
                        </div>
                        <div class="form-group full"><label>Remarque</label><textarea id="f-remarque"
                                rows="2"></textarea></div>
                    </div>
                </div>

                <div id="form-utilisateurs-container" class="form-container hidden">
                    <div class="form-grid">
                        <div class="form-group"><label>Nom & Prénom</label><input type="text" id="u-nom"></div>
                        <div class="form-group"><label>Email (Login)</label><input type="email" id="u-email"></div>
                        <div class="form-group"><label>Mot de passe</label><input type="password" id="u-password"></div>
                        <div class="form-group"><label>Rôle</label>
                            <select id="u-role">
                                <option value="Manager">Manager</option>
                                <option value="User">User</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Structure ID</label><input type="number" id="u-id-structure">
                        </div>
                        <div class="form-group"><label>Téléphone</label><input type="text" id="u-tel"></div>
                    </div>
                </div>

                <div id="form-structures-container" class="form-container hidden">
                    <div class="form-grid">
                        <div class="form-group full"><label>Nom de la Structure</label><input type="text" id="s-nom">
                        </div>
                        <div class="form-group full"><label>Référence Interne</label><input type="text" id="s-ref">
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal()"
                        style="background:#f1f5f9;">Annuler</button>
                    <button type="button" class="btn btn-add" id="submitBtn"
                        onclick="submitDynamicForm()">Confirmer</button>
                </div>
            </div>

        </div>
    </div>

    <div id="importModal" class="modal">
        <div class="modal-content" style="max-width:400px;">
            <div class="step2-header">
                <h2>📥 Importation Excel / CSV</h2>
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Type d'importation</label>
                <div style="display: flex; gap: 20px; margin-top: 10px;">
                    <label
                        style="display: flex; align-items: center; gap: 8px; font-weight: normal; text-transform: none; color: var(--text-main); font-size: 0.9rem; margin-bottom: 0;">
                        <input type="radio" name="import_type" value="facture" checked style="width: auto; padding: 0;">
                        Importer des factures
                    </label>
                    <label
                        style="display: flex; align-items: center; gap: 8px; font-weight: normal; text-transform: none; color: var(--text-main); font-size: 0.9rem; margin-bottom: 0;">
                        <input type="radio" name="import_type" value="paiement" style="width: auto; padding: 0;">
                        Importer des paiements
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label>Fichier Excel ou CSV</label>
                <input type="file" id="f-import-file" accept=".xlsx, .xls, .csv"
                    style="font-size: 0.8rem; width: 100%; box-sizing:border-box;">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="closeImportModal()"
                    style="background:#f1f5f9;">Annuler</button>
                <button type="button" class="btn btn-import" onclick="submitImport()">Importer</button>
            </div>
        </div>
    </div>

    <div id="pdfModal" class="modal">
        <div class="modal-content" style="max-width:400px;">
            <div class="step2-header">
                <h2>📄 Envoi PDF</h2>
            </div>
            <div class="form-group">
                <label>Fichier PDF</label>
                <input type="file" id="f-pdf-file-modal" accept=".pdf"
                    style="font-size: 0.8rem; width: 100%; box-sizing:border-box;">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="closePdfModal()" style="background:#f1f5f9;">Annuler</button>
                <button type="button" class="btn" style="background:#ef4444;color:white;"
                    onclick="submitPdfModal()">Envoyer</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseAuth = window.supabase.createClient(
            "https://nwfidbulykczpudzpwnr.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53ZmlkYnVseWtjenB1ZHpwd25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMTM5MzAsImV4cCI6MjA4NTY4OTkzMH0.JP033Ta2OvdO6tzTODmMSSAuOyy6meUypcjtddJGlNI"
        );

        async function handleLogout() {
            await supabaseAuth.auth.signOut();
            localStorage.removeItem('userRole');
            window.location.href = "auth.html";
        }

        const N8N_WEBHOOK_URL = "https://n8n.srv1312391.hstgr.cloud/webhook-test/admin-action";
        let _pendingRowData = {};

        function getActionButtons(table, context) {
            const modifyBtn = `
                <button class="action-choice-btn" onclick="selectAction('Modifier')">
                    <span class="icon">✏️</span> Modifier
                </button>`;
            const deleteBtn = `
                <button class="action-choice-btn danger" onclick="selectAction('Supprimer')">
                    <span class="icon">🗑️</span> Supprimer
                </button>`;
            const ligiteBtn = `
                <button class="action-choice-btn warning" onclick="selectAction('Litige')">
                    <span class="icon">⚠️</span> Litige
                </button>`;
            const avoirBtn = `
                <button class="action-choice-btn" onclick="selectAction('Avoir')">
                    <span class="icon">💸</span> Avoir
                </button>`;
            const clotureeBtn = `
                <button class="action-choice-btn success" onclick="selectAction('Cloturee')">
                    <span class="icon">🔒</span> Clôturée
                </button>`;

            if (context === 'add') return null;

            let buttons = modifyBtn + deleteBtn;
            if (table === 'factures') buttons += ligiteBtn + avoirBtn + clotureeBtn;
            return buttons;
        }

        function openModal(context, table, data = {}) {
            _pendingRowData = data;
            document.getElementById('field-table').value = table;

            if (context === 'add') {
                selectAction('Ajouter');
                document.getElementById('actionModal').style.display = 'block';
                return;
            }

            const container = document.getElementById('action-choices-container');
            container.innerHTML = getActionButtons(table, 'row');

            document.getElementById('step-1').style.display = 'block';
            document.getElementById('step-2').style.display = 'none';
            document.getElementById('actionModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('actionModal').style.display = 'none';
            _pendingRowData = {};
        }

        function openImportModal() {
            document.getElementById('f-import-file').value = '';
            document.getElementById('importModal').style.display = 'block';
        }

        function closeImportModal() {
            document.getElementById('importModal').style.display = 'none';
            document.getElementById('f-import-file').value = '';
        }

        function openPdfModal() {
            document.getElementById('f-pdf-file-modal').value = '';
            document.getElementById('pdfModal').style.display = 'block';
        }

        function closePdfModal() {
            document.getElementById('pdfModal').style.display = 'none';
            document.getElementById('f-pdf-file-modal').value = '';
        }

        async function submitPdfModal() {
            const fileInput = document.getElementById('f-pdf-file-modal');
            if (!fileInput || fileInput.files.length === 0) {
                alert("Veuillez sélectionner un fichier PDF.");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64Data = e.target.result.split(',')[1];
                await sendPayload({ target: 'factures', mode: 'PDF', fileName: file.name, fileData: base64Data }, 'factures');
                closePdfModal();
            };
            reader.readAsDataURL(file);
        }

        async function submitImport() {
            const fileInput = document.getElementById('f-import-file');
            if (!fileInput || fileInput.files.length === 0) {
                alert("Veuillez sélectionner un fichier.");
                return;
            }

            const importTypeElement = document.querySelector('input[name="import_type"]:checked');
            const importType = importTypeElement ? importTypeElement.value : 'facture';

            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64Data = e.target.result.split(',')[1];
                await sendPayload({ target: 'factures', mode: 'Importation', fileName: file.name, fileData: base64Data, import_type: importType }, 'factures');
                closeImportModal();
            };
            reader.readAsDataURL(file);
        }

        async function loadFacturesSelectData() {
            try {
                const [resClients, resStructures] = await Promise.all([
                    fetch(N8N_WEBHOOK_URL, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ target: 'affichage_tables', table_name: 'clients', mode: 'Afficher_table' })
                    }),
                    fetch(N8N_WEBHOOK_URL, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ target: 'affichage_tables', table_name: 'structures', mode: 'Afficher_table' })
                    })
                ]);
                const clients = await resClients.json();
                const structures = await resStructures.json();

                document.getElementById('list-clients').innerHTML =
                    clients.map(c => `<option value="${c.nom}">`).join('');

                document.getElementById('list-structures').innerHTML =
                    structures.map(s => `<option value="${s.nom}">`).join('');

            } catch (e) {
                console.error('Erreur chargement suggestions datalist', e);
            }
        }

        function selectAction(mode) {

        function getFuzzy(data, keys) {
            if (!data) return '';
            const normalizedData = {};
            for (let key in data) {
                if (data[key] !== null && data[key] !== undefined) {
                    const normKey = String(key).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, '');
                    normalizedData[normKey] = data[key];
                }
            }
            for (let k of keys) {
                const normK = String(k).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, '');
                if (normalizedData[normK] !== undefined && normalizedData[normK] !== '') {
                    return normalizedData[normK];
                }
            }
            return '';
        }

        function formatDateForInput(dateStr) {
            if (!dateStr) return '';
            const s = String(dateStr).trim();
            if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0, 10);
            const parts = s.match(/^(\d{2})[\/\-](\d{2})[\/\-](\d{4})/);
            if (parts) return `${parts[3]}-${parts[2]}-${parts[1]}`;
            return s;
        }

        function selectFuzzyOption(selectId, value) {
            const select = document.getElementById(selectId);
            if (!select || !value) return;
            const normVal = String(value).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, '');
            for (let i = 0; i < select.options.length; i++) {
                const optVal = select.options[i].value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, '');
                if (optVal === normVal && normVal !== '') {
                    select.selectedIndex = i;
                    return;
                }
            }
            select.value = value; // Fallback
        }

        async function sendPayload(payload, table) {
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = "Traitement en cours...";
                submitBtn.style.opacity = "0.7";
            }
            try {
                const res = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    let responseText = await res.text();
                    let isError = false;
                    let errorMessage = "";
                    if (responseText) {
                        try {
                            const data = JSON.parse(responseText);
                            if (data.error || data.success === false) {
                                isError = true;
                                errorMessage = data.error || data.message || "Erreur signalée par le serveur.";
                            }
                        } catch (e) {
                            if (responseText.toLowerCase().includes('error') || responseText.toLowerCase().includes('erreur')) {
                                isError = true;
                                errorMessage = responseText;
                            }
                        }
                    }

                    if (isError) {
                        alert("Échec de l'opération.\nDétail : " + errorMessage);
                    } else {
                        alert("Opération réussie !");
                        closeModal();
                        loadData(table);
                    }
                } else {
                    let errorMessage = `Erreur HTTP ${res.status} (${res.statusText})`;
                    try {
                        const text = await res.text();
                        if (text) {
                            try {
                                const errorData = JSON.parse(text);
                                errorMessage += `\nDétail : ${errorData.error || errorData.message || text}`;
                            } catch (e) {
                                errorMessage += `\nDétail : ${text}`;
                            }
                        }
                    } catch (e) { }
                    alert("Échec de l'opération.\n" + errorMessage);
                }
            } catch (err) {
                alert("Erreur réseau ou d'exécution.\nImpossible de joindre le serveur.\nDétail : " + err.message);
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = "Confirmer";
                    submitBtn.style.opacity = "1";
                }
            }
        }

                    try { const text = await res.text(); if (text) errMsg += ` - ${text}`; } catch (e) { }
                    throw new Error(errMsg);
                }
                const data = await res.json();
                const columns = Object.keys(data[0] || {}).filter(c => c.toLowerCase() !== 'id');
